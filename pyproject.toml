[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-beauty"
version = "0.8.0"
description = "View one markdown file, several, or a whole folder as a clean, readable website."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mahmoud Sabry" }]
keywords = ["markdown", "notes", "mkdocs", "theme", "documentation", "static-site"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["mkdocs-material>=9.6,<10", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
md-beauty = "md_beauty.cli:main"

[project.urls]
Homepage = "https://github.com/engmhmoud/md-beauty"
Issues = "https://github.com/engmhmoud/md-beauty/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/md_beauty"]
