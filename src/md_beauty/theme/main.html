{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    // apply saved reading layout before first paint (see assets/md-beauty.js)
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        if (s.getItem("mb-hide-nav") === "1") d.classList.add("mb-hide-nav");
        if (s.getItem("mb-hide-toc") === "1") d.classList.add("mb-hide-toc");
        var t = parseFloat(s.getItem("mb-text-scale"));
        if (t) d.style.setProperty("--mb-text-scale", t);
      } catch (e) {}
    })();
  </script>
{% endblock %}

{% block content %}
  {% if page.parent and page.parent.title %}
    <div class="mb-eyebrow">{{ page.parent.title }}</div>
  {% endif %}
  {{ super() }}
  {% if page.file and not page.is_homepage %}
    <div class="mb-read-row">
      <span>Mark as read</span>
      <button class="mb-read-toggle" type="button" role="switch" aria-checked="false"
              data-page="{{ page.url }}" aria-label="Mark this page as read"></button>
    </div>
  {% endif %}
{% endblock %}
