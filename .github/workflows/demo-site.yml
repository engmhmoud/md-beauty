# Builds examples/demo with md-beauty itself and publishes it as the live demo on GitHub Pages.
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[test]"
      - run: pytest -q
      - run: python extension/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: md-beauty-extension
          path: extension/dist
      - uses: actions/configure-pages@v5
        id: pages
      - run: md-beauty build examples/demo -o site --site-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
